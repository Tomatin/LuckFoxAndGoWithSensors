<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Sensores</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 20px 0;
    }
    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      padding: 16px;
      min-width: 180px;
      text-align: center;
    }
    #map {
      width: 90%;
      height: 400px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }
    #invalid-msg {
      color: red;
      font-weight: bold;
      margin-bottom: 20px;
      display: none;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Dashboard Sensors</h1>
  
  <div class="cards">
    <div class="card"><b>Temperature</b><div id="temperature">--</div></div>
    <div class="card"><b>Humidity</b><div id="humidity">--</div></div>
    <div class="card"><b>Time</b><div id="time">--</div></div>
    <div class="card"><b>Lat</b><div id="lat">--</div></div>
    <div class="card"><b>Long</b><div id="lon">--</div></div>
    <div class="card"><b>Knots</b><div id="knots">--</div></div>
    <div class="card"><b>Course</b><div id="course">--</div></div>
    <div class="card"><b>Valid</b><div id="valid">--</div></div>
  </div>

  <div id="invalid-msg">Invalid GPS data: / wait signal</div>

  <iframe id="map" 
    src="https://maps.google.com/maps?q=0,0&z=14&output=embed">
  </iframe>

  <button onclick="updateData()">Update</button>

  <script>
    async function updateData() {
      try {
        const res = await fetch('/update');
        const data = await res.json();

        // Show json values
        document.getElementById('temperature').textContent = data.Temperature + " °C";
        document.getElementById('humidity').textContent = data.Humidity + " %";
        document.getElementById('time').textContent = data.Time;
        document.getElementById('lat').textContent = data.Latitude;
        document.getElementById('lon').textContent = data.Longitude;
        document.getElementById('knots').textContent = data.Knots;
        document.getElementById('course').textContent = data.Course;
        document.getElementById('valid').textContent = data.Valid ? "Yes" : "No";

        const map = document.getElementById('map');
        const msg = document.getElementById('invalid-msg');

        if(data.Valid){
          // Valid GPS data then show maps
          map.style.display = "block";
          msg.style.display = "none";
          map.src = `https://maps.google.com/maps?q=${data.Latitude},${data.Longitude}&z=14&output=embed`;
        } else {
          // Invalid GPS data then hide maps
          map.style.display = "none";
          msg.style.display = "block";
        }

      } catch (err) {
        alert("Error to get data: " + err);
      }
    }

    // In the start load data
    updateData();
  </script>
</body>
</html>
